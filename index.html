<script>
/* ================= SERVICE WORKER ================= */
if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
        navigator.serviceWorker.register('service-worker.js')
            .then(reg => console.log('ServiceWorker registered:', reg.scope))
            .catch(err => console.error('ServiceWorker registration failed:', err));
    });
}

/* ================= POPUP (replaces alert) ================= */
let popupTimer;
function showPopup(message) {
    let el = document.getElementById("fontPopup");
    if (!el) {
        el = document.createElement("div");
        el.id = "fontPopup";
        el.className = "font-popup";
        document.body.appendChild(el);
    }
    el.textContent = message;
    el.classList.add("show");
    clearTimeout(popupTimer);
    popupTimer = setTimeout(() => el.classList.remove("show"), 1500);
}

/* ================= API CONFIG ================= */
const API_KEY = "umh_7df845103c420e9349889a08dd16d6563e4c0a1d";
const API_BASE = "https://ummahapi.com/api";

async function apiGet(path, params = {}) {
    const qs = new URLSearchParams(params).toString();
    const url = `${API_BASE}${path}${qs ? "?" + qs : ""}`;
    const res = await fetch(url, { headers: { "x-api-key": API_KEY } });
    if (!res.ok) throw new Error(`API ${res.status}`);
    return res.json();
}

/* ================= HIJRI DATE (device, Umm al-Qura) ================= */
function updateHijriDisplay() {
    const el = document.getElementById("hijriDateDisplay");
    try {
        el.innerText = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura', {
            day: 'numeric', month: 'long', year: 'numeric'
        }).format(new Date());
    } catch (e) {
        el.innerText = "";
    }
}

/* ================= LOCATION ================= */
function getLocation() {
    return new Promise((resolve, reject) => {
        if (!navigator.geolocation) {
            return reject(new Error("Geolocation not supported"));
        }
        navigator.geolocation.getCurrentPosition(
            pos => {
                const loc = { lat: pos.coords.latitude, lng: pos.coords.longitude };
                localStorage.setItem("lastLocation", JSON.stringify(loc));
                resolve(loc);
            },
            () => {
                const saved = localStorage.getItem("lastLocation");
                if (saved) resolve(JSON.parse(saved));
                else reject(new Error("Location permission denied"));
            },
            { enableHighAccuracy: false, timeout: 10000, maximumAge: 600000 }
        );
    });
}

/* ================= PRAYER TIMES ================= */
let prayerMethod = localStorage.getItem("prayerMethod") || "";
let prayerMethodName = localStorage.getItem("prayerMethodName") || "";

const PRAYER_LABELS = {
    imsak: "Imsak", fajr: "Fajr", sunrise: "Sunrise",
    dhuhr: "Dhuhr", asr: "Asr", maghrib: "Maghrib", isha: "Isha"
};
const PRAYER_ORDER = ["fajr", "sunrise", "dhuhr", "asr", "maghrib", "isha"];

function updateMethodLabel(fallbackId) {
    const label = prayerMethodName || fallbackId || "Default";
    document.getElementById("methodCurrent").innerText = `Method: ${label}`;
}

function renderPrayerTimes(json) {
    const d = json.data || {};
    const t = d.prayer_times || {};
    const status = d.current_status || {};
    const next = status.next_prayer;

    const info = next
        ? `<p class="method-current">Next: ${PRAYER_LABELS[next] || next} in ${status.time_until_next || ""}</p>`
        : "";

    const rows = PRAYER_ORDER
        .filter(k => t[k])
        .map(k => {
            const style = k === next ? ' style="color:#007bff"' : "";
            return `<div class="prayer-row"${style}><span>${PRAYER_LABELS[k]}</span><b>${t[k]}</b></div>`;
        })
        .join("");

    document.getElementById("prayerBody").innerHTML = (info + rows) || "No prayer times found.";
    updateMethodLabel(d.calculation_method);
}

async function loadPrayerTimes(silent = false) {
    const body = document.getElementById("prayerBody");
    if (!silent) body.innerText = "⏳ Getting location...";
    try {
        const loc = await getLocation();
        if (!silent) body.innerText = "⏳ Loading prayer times...";
        const params = { lat: loc.lat, lng: loc.lng };
        if (prayerMethod) params.method = prayerMethod;
        const json = await apiGet("/prayer-times", params);
        renderPrayerTimes(json);
    } catch (err) {
        if (!silent) body.innerText = `Failed: ${err.message}`;
    }
}

async function openMethodModal() {
    openModal("methodModal");
    const list = document.getElementById("methodList");
    list.innerText = "Loading methods...";
    try {
        const json = await apiGet("/prayer-methods");
        const methods = (json.data && json.data.methods) || {};
        const entries = Object.entries(methods);
        list.innerHTML = "";
        if (!entries.length) {
            list.innerText = "No methods found.";
            return;
        }
        entries.forEach(([id, m]) => {
            const name = m.name || id;

            const b = document.createElement("button");
            b.className = "method-item" + (id === prayerMethod ? " active" : "");

            const title = document.createElement("div");
            title.style.fontWeight = "bold";
            title.textContent = name;

            const desc = document.createElement("small");
            desc.textContent = m.description || "";

            b.append(title, desc);
            b.addEventListener("click", () => {
                prayerMethod = id;
                prayerMethodName = name;
                localStorage.setItem("prayerMethod", prayerMethod);
                localStorage.setItem("prayerMethodName", prayerMethodName);
                closeModal("methodModal");
                loadPrayerTimes();
            });
            list.appendChild(b);
        });
    } catch (err) {
        list.innerText = `Failed: ${err.message}`;
    }
}

function extractHadith(json) {
    const d = json.data || json;
    const fields = ["arabic", "text", "hadith", "english", "translation"];
    const parts = fields.map(f => d[f]).filter(v => typeof v === "string" && v.trim());
    if (!parts.length) return JSON.stringify(json, null, 2);
    const source = d.source || d.reference || d.book;
    return parts.join("\n\n") + (source ? `\n\n— ${source}` : "");
}

async function loadHadith() {
    const body = document.getElementById("hadithBody");
    body.innerText = "⏳ Loading...";
    try {
        const json = await apiGet("/hadith/random");
        body.innerText = extractHadith(json);
    } catch (err) {
        body.innerText = `Failed: ${err.message}`;
    }
}

    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins < 10 ? '0' : ''}${mins}:${secs < 10 ? '0' : ''}${secs}`;
}

/* ================= PDF VIEWER (PDF.js, scrollable) ================= */
if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
}

let pdfRenderToken = 0;

async function loadPdfFile(index) {
    currentPdfIndex = index;
    const file = pdfFiles[currentPdfIndex];
    document.getElementById("pdfFileName").innerText = file.replace('pdf/', '');

    const container = document.getElementById("pdfPages");
    container.scrollTop = 0;
    container.innerHTML = '<div class="pdf-msg">⏳ Loading PDF...</div>';

    const token = ++pdfRenderToken;

    if (!window.pdfjsLib) {
        container.innerHTML = `<div class="pdf-msg">PDF engine failed to load. Check internet connection.</div>`;
        return;
    }

    try {
        const doc = await pdfjsLib.getDocument(file).promise;
        if (token !== pdfRenderToken) return;

        container.innerHTML = "";
        const dpr = window.devicePixelRatio || 1;
        const targetWidth = Math.max(200, container.clientWidth - 16);

        for (let n = 1; n <= doc.numPages; n++) {
            const page = await doc.getPage(n);
            if (token !== pdfRenderToken) return;

            const base = page.getViewport({ scale: 1 });
            const scale = (targetWidth * dpr) / base.width;
            const vp = page.getViewport({ scale });

            const canvas = document.createElement("canvas");
            canvas.width = Math.floor(vp.width);
            canvas.height = Math.floor(vp.height);

            await page.render({ canvasContext: canvas.getContext("2d"), viewport: vp }).promise;
            if (token !== pdfRenderToken) return;

            container.appendChild(canvas);
        }
    } catch (err) {
        if (token === pdfRenderToken) {
            container.innerHTML = `<div class="pdf-msg">Failed to load PDF: ${file}<br>${err.message}</div>`;
        }
    }
}

/* ================= HAPTICS ================= */
function haptic(type) {
    if (isIOS) {
        const clickShort = document.getElementById("clickShort");
        const clickLong = document.getElementById("clickLong");

        if (type === "short") {
            clickShort.currentTime = 0;
            clickShort.play().catch(() => {});
        }
        if (type === "long") {
            clickLong.currentTime = 0;
            clickLong.play().catch(() => {});
        }
        if (type === "double") {
            clickLong.currentTime = 0;
            clickLong.play().catch(() => {});
            setTimeout(() => {
                clickLong.currentTime = 0;
                clickLong.play().catch(() => {});
            }, 200);
        }
    } else if (navigator.vibrate) {
        if (type === "short") navigator.vibrate(40);
        if (type === "long") navigator.vibrate(250);
        if (type === "double") navigator.vibrate([200, 150, 200]);
    }
}

/* ================= TELEMETRY (once per session, runs last) ================= */
const TELEMETRY_URL = "https://script.google.com/macros/s/AKfycbxXOgLEtYhaKzyMpWb-k_FJFJIuUWXVy7VoaOpE8vWnU_jQ9bvZsKO_nCdigZKsyGD62A/exec";

function getSessionDeviceId() {
    let id = sessionStorage.getItem("deviceId");
    if (!id) {
        id = (window.crypto && crypto.randomUUID)
            ? crypto.randomUUID()
            : "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, c => {
                const r = Math.random() * 16 | 0;
                return (c === "x" ? r : (r & 0x3 | 0x8)).toString(16);
              });
        sessionStorage.setItem("deviceId", id);
    }
    return id;
}

function getDeviceModel() {
    const ua = navigator.userAgent;
    if (/iPhone/.test(ua)) return "iPhone";
    if (/iPad/.test(ua)) return "iPad";
    if (/Android/.test(ua)) {
        const m = ua.match(/Android[^;]*;\s*([^;)]*?)\s*(?:Build|\))/);
        return m && m[1] ? m[1].trim() : "Android";
    }
    if (/Windows/.test(ua)) return "Windows PC";
    if (/Macintosh/.test(ua)) return "Mac";
    if (/Linux/.test(ua)) return "Linux";
    return navigator.platform || "Unknown";
}

function sendTelemetry() {
    try {
        const params = new URLSearchParams({
            timestamp: new Date().toISOString(),
            deviceid: getSessionDeviceId(),
            devicemodal: getDeviceModel()
        });
        fetch(`${TELEMETRY_URL}?${params.toString()}`, { mode: "no-cors", keepalive: true })
            .catch(() => {});
    } catch (e) {
        /* telemetry must never break the app */
    }
}
